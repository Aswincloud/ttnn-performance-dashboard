name: Daily eltwise perf (tt-metal)

# Ingests a Tenstorrent eltwise perf run end to end:
#   [dispatch box, not here] rebase our tt-metal branch on upstream main ->
#   dispatch ONE test-dispatch run that fans out to 8 combos x SHARD_TOTAL
#   shards off one build (N150 and P100a (Blackhole), each at 2 dtypes x
#   2 shapes) -> start THIS workflow with mode=monitor run_id=<run>
#   [here] -> poll it to completion -> download the raw shard artifacts and merge
#   each combo's shards locally (tt-metal uploads raw shards; we do the merge)
#   -> land the 8 combined JSONs under data/workflow/{bf16,fp32}/{32x32,256x256}/
#   and data/workflow/p100a/{bf16,fp32}/{32x32,256x256}/
#   via a single auto-merging PR.
#
# Credentials: the only privileged tt-metal calls (rebase push + dispatch, and
# re-running failed jobs) happen on the dispatch box with its owner's gh login,
# which never leaves that machine (~/bin/perf-ci-dispatch.sh). PATs are banned
# for tenstorrent repos since ITSEC-295, and no tenstorrent credential is stored
# here. Everything this workflow does on tt-metal is a READ of a public repo
# (run status, jobs, artifact zips), so it uses this repo's own github.token.

on:
  schedule:
    # The MAIN run is no longer scheduled here: the dispatch box starts it at
    # 01:00 IST with workflow_dispatch mode=monitor (it holds the only credential
    # that can dispatch on tt-metal).
    - cron: "30 23 * * *"   # 23:30 UTC = 05:00 IST — FRESHNESS CHECK (read-only).
    # The box dispatches at 01:00 IST and the run normally lands within ~1h.
    # This pass ingests nothing: it checks that EVERY combo has a result
    # measured in the last 24h and fails (issue + Slack) naming the stale ones.
    # To ingest a finished run by hand, use workflow_dispatch mode=recover.
  workflow_dispatch:
    inputs:
      mode:
        description: "monitor = poll the given (just-dispatched) tt-metal run, then ingest it; recover = just ingest an already-completed run"
        type: choice
        options: [monitor, recover]
        default: monitor
      run_id:
        description: "tt-metal test-dispatch run id. Required for monitor; for recover, blank = newest successful run on the branch"
        required: false
        default: ""

# Never cancel an in-flight run: it owns viommu hardware jobs on tt-metal's
# shared pool, and a scheduled run must not orphan them.
concurrency:
  group: daily-eltwise-perf
  cancel-in-progress: false

permissions:
  contents: read
  actions: read            # explicit; tt-metal reads are public-repo reads anyway
  issues: write            # GITHUB_TOKEN files/dedupes failure & conflict issues

env:
  OUR_REPO: Aswincloud/ttnn-performance-dashboard
  TT_REPO: tenstorrent/tt-metal
  TT_BRANCH: Aswinmcw/test_eltwise_perf
  # One combo key per cell group the tt-metal matrix produces. A key's
  # segments map 1:1 onto the artifact infix ('-' joined) and the directory
  # ('/' joined): the LAST two are always <dtype>_<shape>, and any leading
  # segment names the board. No board segment means N150 -- the original
  # board, kept implicit so the four existing combos' directories, history
  # and users' saved selections stay untouched when another board is added.
  #   bf16_32x32        -> eltwise-perf-results-bf16-32x32-shard-*       -> data/workflow/bf16/32x32/
  #   p100a_bf16_32x32  -> eltwise-perf-results-p100a-bf16-32x32-shard-* -> data/workflow/p100a/bf16/32x32/
  # These must match the tt-metal matrix exactly: a mismatch yields "no
  # shards found" (a loud artifact-missing failure), never wrong data.
  COMBOS: "bf16_32x32 bf16_256x256 fp32_32x32 fp32_256x256 p100a_bf16_32x32 p100a_bf16_256x256 p100a_fp32_32x32 p100a_fp32_256x256"
  # Shards per combo. Must match the `shard:` list in the tt-metal branch's
  # test-dispatch.yaml matrix. 1 since --in-process: one runner opens the
  # device once and finishes the whole suite in about a minute, so sharding
  # only multiplies runner/setup cost. The download step requires AT LEAST
  # this many, so an older 5-shard run still merges fine.
  SHARD_TOTAL: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # < GitHub's hard 6h (360m) hosted-runner cap; the
                           # poll deadline itself is 5.5h (see DEADLINE below)
    steps:
      # 0. Checkout our repo (commit base) + compute the run date.
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout dashboard repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Don't persist GITHUB_TOKEN as a git http.extraheader: it would
          # override the App token we embed in the push URL for the result PR
          # (git applies the extraheader to any github.com push), causing a 403
          # as github-actions[bot]. All steps here authenticate explicitly.
          persist-credentials: false

      # 0a. Classify this invocation into one of three modes, consumed by the
      #     `if:` on every later step:
      #       monitor    — poll the run the dispatch box started, then ingest (the daily run).
      #       recover    — manual `mode=recover`: skip rebase/dispatch/poll and
      #                    ingest an already-completed tt-metal run.
      #       freshness  — the 23:30 UTC cron: read-only check that every combo
      #                    has a result from the last 24h; ingests nothing.
      - name: Detect mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "schedule" ]; then
            MODE=freshness
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "${INPUT_MODE:-monitor}" = "recover" ]; then
            MODE=recover
          else
            MODE=monitor
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "🧭 mode=$MODE (event=$EVENT schedule='${SCHEDULE:-}' input='${INPUT_MODE:-}')"

      - name: Compute run date
        id: guard
        run: |
          set -euo pipefail
          # No idempotency skip: result filenames are timestamped and land in
          # per-combo subdirs, so a same-day re-run never collides.
          # IST, not UTC: the cron is 1:00 AM IST (19:30 UTC of the prior day),
          # so a UTC date here would label the file/branch/PR the previous day —
          # mismatching the IST measurement_date the perf script now stamps. Use
          # Asia/Kolkata so the filename prefix agrees with the in-file date.
          # NOTE: the authoritative date is re-derived at commit time from the
          # merged file's metadata.measurement_date (a run ingested the next
          # morning must NOT be dated "today"); this value is only a fallback.
          echo "date=$(TZ='Asia/Kolkata' date +%F)" >> "$GITHUB_OUTPUT"

      # 0b. Freshness mode only (the 05:00 IST cron). Read-only: every combo in
      #     COMBOS must have a result whose measurement_date is within the last
      #     24h, per data/workflow/index.json on main. A stale combo fails the
      #     job, so the issue + Slack steps below fire with the list.
      - name: Freshness check (all combos, last 24h)
        id: freshness
        if: steps.mode.outputs.mode == 'freshness'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, datetime as dt
          IST = dt.timezone(dt.timedelta(hours=5, minutes=30))
          now = dt.datetime.now(dt.timezone.utc)
          combos = json.load(open("data/workflow/index.json"))["combos"]
          stale = []
          for combo in os.environ["COMBOS"].split():
              newest = None
              for f in combos.get(combo, {}).get("files", []):
                  md = f.get("measurement_date")
                  if not md:
                      continue
                  t = dt.datetime.fromisoformat(md)
                  if t.tzinfo is None:          # older local files carry no offset; they are IST
                      t = t.replace(tzinfo=IST)
                  newest = t if newest is None or t > newest else newest
              age_h = (now - newest).total_seconds() / 3600 if newest else None
              when = newest.astimezone(IST).strftime("%Y-%m-%d %H:%M IST") if newest else "none"
              ok = age_h is not None and age_h <= 24
              print(f"{'OK   ' if ok else 'STALE'} {combo:18s} newest {when}" + (f" ({age_h:.1f}h ago)" if age_h is not None else ""))
              if not ok:
                  stale.append(f"{combo} (newest {when})")
          if stale:
              with open(os.environ["GITHUB_ENV"], "a") as env:
                  env.write("FAIL_KIND=stale-data\n")
                  env.write("FAIL_DETAIL=no result measured in the last 24h for: " + "; ".join(stale) + "\n")
              print("::error::No perf result in the last 24h for: " + ", ".join(x.split(" ")[0] for x in stale))
              raise SystemExit(1)
          print("All combos have a result from the last 24h.")
          PY

      # 0c. Collapse mode + gap-check into two booleans so every later step gates
      #     on a single equality instead of a repeated 3-clause expression:
      #       poll     — poll the tt-metal run to completion (monitor only).
      #       ingest   — do resolve + download + merge + commit (monitor & recover
      #                  only; freshness ingests nothing).
      - name: Plan run
        id: plan
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          # POLL only in monitor: recover acts on an already-completed run;
          # freshness is a read-only check (its own step above) and does neither.
          case "$MODE" in
            monitor) POLL=true;  INGEST=true ;;
            recover) POLL=false; INGEST=true ;;
            freshness) POLL=false; INGEST=false ;;
            *) echo "::error::unknown mode '$MODE'"; exit 1 ;;
          esac
          echo "poll=$POLL"     >> "$GITHUB_OUTPUT"
          echo "ingest=$INGEST" >> "$GITHUB_OUTPUT"
          echo "🧭 plan: poll=$POLL ingest=$INGEST (mode=$MODE)"

      # 2b. Resolve the tt-metal run id every ingest mode will act on, so the
      #     Poll/Download/Slack steps never depend on the (skipped) Dispatch step.
      #       monitor    — the run_id input (required): the run the dispatch
      #                    box just started. Checked to be OUR branch's
      #                    test-dispatch run; Poll then gates on its success.
      #       recover    — the run_id input if given, else the newest SUCCESSFUL
      #                    test-dispatch run on our branch.
      #     Because recover SKIPS the Poll step (and thus its
      #     CONCL==success gate), this step re-validates that the resolved run is
      #     completed/successful — an operator-supplied run_id is untrusted.
      - name: Resolve tt-metal run
        id: resolve
        if: steps.plan.outputs.ingest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.mode.outputs.mode }}
          INPUT_RUN_ID: ${{ github.event.inputs.run_id }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "monitor" ]; then
            RID="${INPUT_RUN_ID:-}"
            if ! [[ "$RID" =~ ^[0-9]+$ ]]; then
              echo "FAIL_KIND=resolve-run-not-found" >> "$GITHUB_ENV"
              echo "::error::monitor mode needs a numeric run_id input (got '${RID}')."
              exit 1
            fi
            # Only ingest what the dispatch box could have started: OUR branch's
            # test-dispatch.yaml. Anything else is refused, not polled.
            # Retry API blips; a run that can't be fetched is an API/auth error,
            # reported as such, not mislabelled "not our run".
            META=""; ERR=""
            for attempt in 1 2 3 4 5; do
              if META=$(gh api "repos/${TT_REPO}/actions/runs/${RID}" \
                          -q '(.path // "") + "|" + (.head_branch // "") + "|" + (.event // "")' 2>/tmp/resolve.err); then
                break
              fi
              ERR=$(tr '\n' ' ' </tmp/resolve.err | cut -c1-300); META=""
              echo "gh api runs/${RID} failed (attempt ${attempt}/5): ${ERR}"; sleep 15
            done
            if [ -z "$META" ]; then
              echo "FAIL_KIND=poll-api-error" >> "$GITHUB_ENV"
              echo "FAIL_DETAIL=could not fetch tt-metal run ${RID} after 5 attempts: ${ERR}" >> "$GITHUB_ENV"
              echo "::error::could not fetch tt-metal run ${RID}: ${ERR}"
              exit 1
            fi
            IFS='|' read -r R_PATH R_BRANCH R_EVENT <<<"$META"
            echo "run $RID: path=$R_PATH branch=$R_BRANCH event=$R_EVENT"
            if [ "$R_PATH" != ".github/workflows/test-dispatch.yaml" ] || [ "$R_BRANCH" != "$TT_BRANCH" ] || [ "$R_EVENT" != "workflow_dispatch" ]; then
              echo "FAIL_KIND=resolve-run-not-found" >> "$GITHUB_ENV"
              echo "FAIL_DETAIL=run $RID is not a test-dispatch.yaml workflow_dispatch run on ${TT_BRANCH} (path=$R_PATH branch=$R_BRANCH event=$R_EVENT)" >> "$GITHUB_ENV"
              echo "::error::run $RID is not our branch's test-dispatch run; refusing to monitor it."
              exit 1
            fi
          else
            RID="${INPUT_RUN_ID:-}"
            if [ -n "$RID" ]; then
              echo "Using operator-supplied run id: $RID"
            else
              # Newest successful test-dispatch run on our branch. --status success
              # means auto-pick can't grab a failed/in-progress run; the explicit
              # id path is validated below regardless.
              # Sort by createdAt explicitly. Taking `.[0]` of the listing trusted
              # the API's order, and twice (10-06 03:11, 10-07 02:34) it handed
              # back a run from days/weeks earlier -- 10-07 got a 2026-09-13 run
              # that predated the P100a combo entirely.
              RID=$(gh run list -R "$TT_REPO" -w test-dispatch.yaml -e workflow_dispatch \
                      -b "$TT_BRANCH" --status success -L 50 \
                      --json databaseId,createdAt \
                      -q 'sort_by(.createdAt) | reverse | .[0].databaseId' 2>/dev/null || true)
              echo "Auto-resolved newest successful run: ${RID:-<none>}"
            fi
            if [ -z "$RID" ] || [ "$RID" = "null" ]; then
              echo "FAIL_KIND=resolve-run-not-found" >> "$GITHUB_ENV"
              echo "::error::Could not resolve a tt-metal run to ingest (no successful run on ${TT_BRANCH}, and none supplied)."
              exit 1
            fi
            # Re-validate: recover skips Poll's success gate, so confirm
            # the run actually completed successfully before we trust its shards.
            SC=$(gh run view "$RID" -R "$TT_REPO" --json status,conclusion \
                   -q '.status + "|" + (.conclusion // "")' 2>/dev/null || echo "|")
            ST="${SC%%|*}"; CO="${SC##*|}"
            echo "Resolved run $RID → status=$ST conclusion=$CO"
            if [ "$ST" != "completed" ] || [ "$CO" != "success" ]; then
              echo "FAIL_KIND=recover-run-not-successful" >> "$GITHUB_ENV"
              echo "FAIL_DETAIL=run $RID is status=$ST conclusion=$CO (need completed/success)" >> "$GITHUB_ENV"
              echo "::error::Resolved tt-metal run $RID is not completed/successful ($ST/$CO)."
              exit 1
            fi
          fi
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          echo "📌 ingest target: https://github.com/${TT_REPO}/actions/runs/${RID}"

      # 3. Poll the tt-metal run (build + test cells) to completion. Monitor
      #    mode only — recover resolves an already-completed run.
      - name: Poll tt-metal run
        if: steps.plan.outputs.poll == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.resolve.outputs.run_id }}"
          # 5.5h, not 6h: a hosted job is hard-killed at GitHub's 6h (360m) cap,
          # and ~15m around this poll goes to dispatch + download/merge/PR, so a
          # literal 6h poll could never finish. 5.5h (330m) is the largest budget
          # that still lets THIS clean poll-timeout fire before GitHub's generic
          # kill, while covering the tt-metal dispatch->complete times now drifting
          # past 4h (queue + ~3h exec on the shared HW pool).
          DEADLINE=$(( $(date +%s) + 330*60 ))   # 5.5h
          ERRS=0                                  # consecutive failed polls
          MAX_ERRS=20                             # ~30 min of solid API failures
          ERRLOG=$(mktemp)                        # captured stderr of the last poll
          # Re-running failed jobs is a WRITE on tt-metal; github.token can only
          # read it. So no automatic retry here: a partial failure fails with a
          # pointer to the dispatch box, which re-runs it with its gh login
          # (perf-ci-dispatch.sh --rerun <id>) and starts monitor mode again.
          RETRIES_LEFT=0
          while :; do
            # A single flaky `gh run view` (GitHub API 500 / Connect-Timeout) must
            # NOT abort the whole run — it used to under set -e, ending the poll
            # while the tt-metal run was still queued (and the data was fine). Guard
            # the call: on failure, treat this tick as "unknown, keep waiting" and
            # only give up after MAX_ERRS consecutive failures (a real outage / bad
            # token), not one blip. Capture stderr (don't discard it) so the actual
            # cause — auth / rate-limit / network — shows in the log and the final
            # error, which matters for triage.
            if S=$(gh run view "$RUN_ID" -R "$TT_REPO" --json status,conclusion \
                     -q '.status + "|" + (.conclusion // "")' 2>"$ERRLOG"); then
              ERRS=0
              STATUS="${S%%|*}"; CONCL="${S##*|}"
              echo "$(date -u +%T) status=$STATUS conclusion=$CONCL"
              if [ "$STATUS" = "completed" ]; then
                [ "$CONCL" = "success" ] && break
                # The run is all-or-nothing, so ONE flaky cell (a HW blip, a
                # runner reclaim) throws away a full day of otherwise-good data.
                # Re-run just the failed jobs once. Safe because re-running only
                # the failed jobs PRESERVES the successful cells' artifacts
                # (verified on run 32662117793: 19 attempt-1 shard artifacts
                # survived the retry), so the run still yields every shard.
                #
                # Only retry a PARTIAL failure — some cells passed AND some
                # failed. A build-phase break leaves zero passing cells and will
                # not fix itself, so that still fails fast with the real reason
                # instead of burning ~12 min on a doomed rebuild.
                CELLS=$(gh run view "$RUN_ID" -R "$TT_REPO" --json jobs \
                          -q '[.jobs[]|select(.name|test("test-dispatch"))]
                              | "\([.[]|select(.conclusion=="success")]|length) \([.[]|select(.conclusion!="success")]|length)"' \
                          2>/dev/null || echo "0 0")
                OK_CELLS="${CELLS%% *}"; BAD_CELLS="${CELLS##* }"
                case "${OK_CELLS}${BAD_CELLS}" in *[!0-9]*) OK_CELLS=0; BAD_CELLS=0 ;; esac
                echo "tt-metal run concluded '$CONCL' — cells: ${OK_CELLS} ok / ${BAD_CELLS} failed"
                if [ "$RETRIES_LEFT" -gt 0 ] && [ "$OK_CELLS" -gt 0 ] && [ "$BAD_CELLS" -gt 0 ]; then
                  RETRIES_LEFT=$(( RETRIES_LEFT - 1 ))
                  ATTEMPT_BEFORE=$(gh api "repos/${TT_REPO}/actions/runs/${RUN_ID}" -q .run_attempt 2>/dev/null || echo 1)
                  echo "::notice::Partial failure (${BAD_CELLS} of $(( OK_CELLS + BAD_CELLS )) cells) — re-running failed jobs once."
                  if ! gh run rerun "$RUN_ID" -R "$TT_REPO" --failed 2>"$ERRLOG"; then
                    echo "FAIL_KIND=tt-run-failed" >> "$GITHUB_ENV"
                    echo "FAIL_DETAIL=partial failure (${BAD_CELLS} cells) and the retry could not be started: $(tr '\n' ' ' <"$ERRLOG" | cut -c1-200)" >> "$GITHUB_ENV"
                    echo "::error::Could not re-run the tt-metal run's failed jobs."
                    exit 1
                  fi
                  # The API keeps reporting completed/<old conclusion> for a few
                  # seconds after a rerun is accepted; resuming the poll straight
                  # away would read that stale value and declare failure. Wait for
                  # the attempt counter to tick over first.
                  NOW_ATTEMPT="$ATTEMPT_BEFORE"
                  for _ in $(seq 1 20); do
                    sleep 15
                    NOW_ATTEMPT=$(gh api "repos/${TT_REPO}/actions/runs/${RUN_ID}" -q .run_attempt 2>/dev/null || echo "$ATTEMPT_BEFORE")
                    [ "$NOW_ATTEMPT" -gt "$ATTEMPT_BEFORE" ] && break
                  done
                  echo "Retry started (attempt ${NOW_ATTEMPT}) — resuming poll."
                  continue
                fi
                RETRY_NOTE=""
                if [ "$OK_CELLS" -gt 0 ] && [ "$BAD_CELLS" -gt 0 ]; then
                  RETRY_NOTE=" — partial failure: on the dispatch box run ~/bin/perf-ci-dispatch.sh --rerun ${RUN_ID}"
                fi
                echo "FAIL_KIND=tt-run-failed" >> "$GITHUB_ENV"
                echo "FAIL_DETAIL=tt-metal run concluded '$CONCL'${RETRY_NOTE} — ${OK_CELLS} ok / ${BAD_CELLS} failed cells (https://github.com/${TT_REPO}/actions/runs/${RUN_ID})" >> "$GITHUB_ENV"
                echo "::error::tt-metal run concluded '$CONCL' (all-or-nothing: no data landed)${RETRY_NOTE}."
                exit 1
              fi
            else
              ERRS=$(( ERRS + 1 ))
              ERRMSG=$(tr '\n' ' ' <"$ERRLOG" | sed 's/  */ /g'; :)
              echo "$(date -u +%T) poll error (${ERRS}/${MAX_ERRS}) — transient, retrying: ${ERRMSG}"
              if [ "$ERRS" -ge "$MAX_ERRS" ]; then
                echo "FAIL_KIND=poll-api-error" >> "$GITHUB_ENV"
                echo "FAIL_DETAIL=last API error: $(printf '%s' "$ERRMSG" | cut -c1-300)" >> "$GITHUB_ENV"
                echo "::error::gh run view kept failing (${ERRS} consecutive) — GitHub API outage or bad token. Last error: ${ERRMSG}"
                exit 1
              fi
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "FAIL_KIND=poll-timeout" >> "$GITHUB_ENV"
              echo "::error::tt-metal run did not complete within 5.5h."
              exit 1
            fi
            sleep 90
          done

      # 4. Download the per-(board, shape) SHARD artifacts and merge each
      #    combo's shards locally. tt-metal only produces raw shards now — the
      #    merge lives HERE, using the perf_measurement_script.py already checked
      #    out in this repo (no raw.githubusercontent curl -> no 429 that a
      #    parallel-combine job on tt-metal used to hit). --merge is a device-free
      #    stdlib post-process; it writes eltwise_perf_results_<ts>_final.json,
      #    which the unchanged commit step below globs and lands.
      - name: Download shards + merge results
        id: download
        if: steps.plan.outputs.ingest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.resolve.outputs.run_id }}"
          for COMBO in $COMBOS; do
            # Combo key -> artifact infix, directory, and the (board, dtype,
            # shape) the provenance gate checks against. See COMBOS above.
            INFIX="${COMBO//_/-}"; DIR="${COMBO//_//}"
            SHAPE="${COMBO##*_}"; REST="${COMBO%_*}"; DT="${REST##*_}"
            BOARD="${REST%_*}"; [ "$BOARD" = "$REST" ] && BOARD=n150
            DEST="_artifact/${DIR}"
            mkdir -p "$DEST/shards"
            # One call grabs all shard artifacts for this combo; each extracts
            # into its own subdir under shards/, so glob recursively.
            # `|| true`: when no artifact matches, gh exits 1 and set -e killed
            # the step with no FAIL_KIND (10-07). Let the shard count below
            # report it as artifact-missing with the combo name instead.
            gh run download "$RUN_ID" -R "$TT_REPO" \
              -p "eltwise-perf-results-${INFIX}-shard-*" -D "$DEST/shards" \
              || echo "::warning::${COMBO}: gh run download found no matching artifact"
            # Count shards up front (paths relative to the workspace root).
            NSHARD=$(find "$DEST/shards" -name 'shard-*.json' | wc -l)
            if [ "$NSHARD" -lt "$SHARD_TOTAL" ]; then
              echo "FAIL_KIND=artifact-missing" >> "$GITHUB_ENV"
              echo "FAIL_DETAIL=${COMBO}: found ${NSHARD} shard JSON(s), expected ${SHARD_TOTAL}" >> "$GITHUB_ENV"
              echo "::error::${COMBO}: found ${NSHARD} shard JSON(s), expected ${SHARD_TOTAL}."
              exit 1
            fi
            # Merge from inside the combo dir so (a) the shard paths passed to
            # --merge are relative to DEST and resolve after the cd, and (b) the
            # _final.json --merge writes to cwd lands right where the commit step
            # globs it. --merge needs no device / tt-metal.
            ( cd "$DEST" \
              && mapfile -t SHARDS < <(find shards -name 'shard-*.json' | sort) \
              && python3 "$GITHUB_WORKSPACE/perf_measurement_script.py" \
                   --merge "${SHARDS[@]}" >/dev/null )
            SRC=$(ls "$DEST"/eltwise_perf_results_*_final.json 2>/dev/null | head -1 || true)
            if [ -z "$SRC" ]; then
              echo "FAIL_KIND=merge-failed" >> "$GITHUB_ENV"
              echo "FAIL_DETAIL=${COMBO}: merge produced no *_final.json" >> "$GITHUB_ENV"
              echo "::error::${COMBO}: merge produced no eltwise_perf_results_*_final.json."
              exit 1
            fi
            # Provenance gate. The combo a file lands in is decided purely by
            # the tt-metal artifact name, while the dtype/shape actually
            # measured is decided by the matrix env reaching a test harness
            # that is curl'd from main at run time. Those two halves are
            # versioned independently, so a stale harness or a typo'd matrix
            # `include:` could file bf16 numbers under fp32/ — permanently and
            # invisibly, since the dashboard shows only the directory. Compare
            # what the run SAYS it measured against where we are about to put
            # it, and refuse the day rather than commit a lie.
            # Absent keys are tolerated: shards produced before provenance
            # stamping landed on main have no perf_* fields.
            GOT=$(python3 -c "import json,sys; m=json.load(open(sys.argv[1]))['metadata']; print(f\"{m.get('perf_dtype') or '?'}|{m.get('perf_shape') or '?'}|{m.get('perf_arch') or '?'}\")" "$SRC")
            IFS='|' read -r GOT_DT GOT_SHAPE GOT_ARCH <<<"$GOT"
            WANT_SHAPE="1,1,${SHAPE%x*},${SHAPE#*x}"
            if [ "$GOT_DT" != "?" ]; then
              case "$GOT_DT" in
                bf16|bfloat16) NORM_DT=bf16 ;;
                fp32|float32|f32) NORM_DT=fp32 ;;
                *) NORM_DT="$GOT_DT" ;;
              esac
              if [ "$NORM_DT" != "$DT" ] || [ "${GOT_SHAPE//[[:space:]]/}" != "$WANT_SHAPE" ]; then
                echo "FAIL_KIND=combo-provenance-mismatch" >> "$GITHUB_ENV"
                echo "FAIL_DETAIL=${COMBO}: run measured dtype='${GOT_DT}' shape='${GOT_SHAPE}' (expected ${DT} / ${WANT_SHAPE})" >> "$GITHUB_ENV"
                echo "::error::${COMBO}: measured dtype='${GOT_DT}' shape='${GOT_SHAPE}', expected '${DT}' / '${WANT_SHAPE}'. Refusing to commit mislabeled data."
                exit 1
              fi
            else
              echo "::notice::${COMBO}: no perf_* provenance in metadata (harness predates stamping) — skipping the check."
            fi
            # Board half of the gate: the cell's runner label decides the board
            # and tt-metal sets ARCH_NAME per board, which the harness stamps as
            # perf_arch. A P100a combo must have been measured on blackhole and
            # an N150 one on wormhole_b0; anything else is a matrix mislabel.
            case "$BOARD" in
              n150)  WANT_ARCH=wormhole_b0 ;;
              p100a) WANT_ARCH=blackhole ;;
              *)     WANT_ARCH="" ;;
            esac
            if [ "$GOT_ARCH" != "?" ] && [ -n "$WANT_ARCH" ] && [ "$GOT_ARCH" != "$WANT_ARCH" ]; then
              echo "FAIL_KIND=combo-provenance-mismatch" >> "$GITHUB_ENV"
              echo "FAIL_DETAIL=${COMBO}: run measured on arch='${GOT_ARCH}' (expected ${WANT_ARCH} for board ${BOARD})" >> "$GITHUB_ENV"
              echo "::error::${COMBO}: measured on arch='${GOT_ARCH}', expected '${WANT_ARCH}' for board '${BOARD}'. Refusing to commit mislabeled data."
              exit 1
            fi
            # Use NSHARD (parent scope) — the SHARDS array is assigned inside the
            # ( … ) subshell above, so it's unbound here and would trip `set -u`.
            echo "📦 ${COMBO}: merged ${NSHARD} shards (${GOT_DT}/${GOT_SHAPE}/${GOT_ARCH}) -> $SRC ($(wc -c <"$SRC") bytes)"
          done

      # 5 + 6. Commit both boards under data/workflow/<hw>/<shape>/ in ONE PR (App
      #        token), approve (WRITE_ACCESS_PAT), enable squash auto-merge (App).
      - name: Mint App token
        id: app
        if: steps.plan.outputs.ingest == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Commit results + open auto-merging PR
        if: steps.plan.outputs.ingest == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}          # bot authors the PR
          APPROVE_TOKEN: ${{ secrets.WRITE_ACCESS_PAT }}     # different identity approves
          GUARD_DATE: ${{ steps.guard.outputs.date }}       # monitor-mode date (today IST)
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          git config user.name "aswincloud-bot[bot]"
          git config user.email "aswincloud-bot[bot]@users.noreply.github.com"

          # DATE: a run may be ingested a day after it was measured (recover,
          # or a next-day --rerun in monitor), so "today" can be
          # wrong — derive the business date from the merged file's own IST
          # measurement_date (metadata.measurement_date, e.g. 2026-07-16T04:55…
          # +05:30) and slice the first 10 chars (never Date-parse it). The
          # primary combo n150/small is always present; use it as the date source.
          # Every mode: a monitored run may be a --rerun finishing the next day,
          # so the invocation date can be wrong for it too. GUARD_DATE stays only
          # as a fallback.
          DATE="$GUARD_DATE"
          PRIMARY=$(ls _artifact/bf16/32x32/eltwise_perf_results_*.json 2>/dev/null | head -1 || true)
          if [ -n "$PRIMARY" ]; then
            DATE=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['metadata']['measurement_date'][:10])" "$PRIMARY")
          fi
          echo "🗓️  run date from measurement_date: $DATE (invocation date $GUARD_DATE, mode=$MODE)"

          BRANCH="workflow/perf-${DATE}-${{ github.run_id }}"
          git checkout -b "$BRANCH"

          # Drop each combo's merged JSON into data/workflow/<key segments joined by />/.
          for COMBO in $COMBOS; do
            DIR="${COMBO//_//}"
            SRC=$(ls _artifact/${DIR}/eltwise_perf_results_*.json | head -1)
            mkdir -p "data/workflow/${DIR}"
            DEST="data/workflow/${DIR}/${DATE}_$(basename "$SRC")"
            cp "$SRC" "$DEST"
            git add "$DEST"
          done

          # Regenerate the per-combo index + the latest_<hw>_<shape>.json
          # snapshots the dashboard reads. Scans data/workflow/**, merges the
          # legacy N150/32x32 history into n150_small, and writes
          # data/workflow/index.json + a latest file per NON-EMPTY combo.
          # Idempotent. Only combos with data get a latest file, so add each
          # explicitly and only if present (a combo with no run yet has none).
          python3 generate_workflow_index.py
          git add data/workflow/index.json
          for LATEST in $COMBOS; do
            [ -f "data/latest/latest_${LATEST}.json" ] && git add "data/latest/latest_${LATEST}.json"
          done
          # Do NOT touch data/daily/, data/index.json, or the legacy
          # data/latest/latest_results.json — those stay as the first-deploy
          # fallback; only the per-combo latest_<hw>_<shape>.json are written here.

          if git diff --cached --quiet; then
            echo "Nothing to commit (identical files already present); skipping PR."
            exit 0
          fi
          git commit -m "data(workflow): eltwise perf results ${DATE} (N150 + P100a, 2 dtypes x 2 shapes)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${OUR_REPO}.git" "$BRANCH"

          # Note the ingest mode in the body so a recovered/backfilled day is
          # distinguishable from a fresh daily run in the PR history.
          ORIGIN="Automated daily"
          [ "$MODE" != "monitor" ] && ORIGIN="Recovered (${MODE})"
          PR_URL=$(gh pr create -R "$OUR_REPO" --base main --head "$BRANCH" \
            --title "data(workflow): eltwise perf results ${DATE} (N150 + P100a, 2 dtypes x 2 shapes)" \
            --body "${ORIGIN} tt-metal eltwise perf run — one build; N150 and P100a (Blackhole), each at 2 dtypes (bfloat16, float32) x 2 shapes (32x32, 256x256); ${SHARD_TOTAL} shard(s) per combo. Data-only, isolated under \`data/workflow/{bf16,fp32}/{32x32,256x256}/\` and \`data/workflow/p100a/{bf16,fp32}/{32x32,256x256}/\`; does not touch \`data/index.json\`.")
          echo "Opened $PR_URL"

          # The membership-gated auto-approve workflow won't fire for a bot
          # author, so approve inline with a different write identity
          # (WRITE_ACCESS_PAT = Aswincloud-Bot, a codeowners-bypass member).
          GH_TOKEN="$APPROVE_TOKEN" gh pr review "$PR_URL" -R "$OUR_REPO" --approve \
            --body "Auto-approving daily perf data PR (generated, isolated under data/workflow/)."

          # No --delete-branch: the repo uses a merge queue, which rejects that
          # flag ("Cannot use --delete-branch when merge queue enabled") and
          # deletes the head branch itself on merge.
          gh pr merge "$PR_URL" -R "$OUR_REPO" --squash --auto
          echo "✅ Auto-merge enabled; merge queue will land it once checks pass."

      # 7. On any failure OR cancellation, file/dedupe an issue assigned to
      #    Aswinmcw. Cancellation is included because a hosted-runner SIGTERM
      #    (as on 2026-07-16) is a `cancelled()`, not a `failure()`, and used to
      #    slip through silently — even though the dispatched tt-metal run may
      #    have succeeded and the day is recoverable.
      - name: File issue on failure
        if: failure() || cancelled()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // A cancel has no FAIL_KIND (no step set one) -> label it 'cancelled'.
            const cancelled = '${{ job.status }}' === 'cancelled';
            const kind = process.env.FAIL_KIND || (cancelled ? 'cancelled' : 'pipeline-failure');
            const kindLabel = `ttnn-perf/${kind}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: kindLabel,
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number,
                body: `Recurred ${new Date().toISOString()} — ${runUrl}`,
              });
              core.info(`Commented on existing issue #${open.data[0].number}`);
            } else {
              // Rebase/dispatch failures are reported by the dispatch box
              // (~/bin/perf-ci-dispatch.sh -> Slack), not by this workflow.
              const detail = kind === 'cancelled'
                ? 'The run was **cancelled** (hosted-runner shutdown or manual). The dispatched tt-metal run may have finished successfully — re-run this workflow with **mode=recover** to ingest it.'
                : `Stage: **${kind}**.`;
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `Daily eltwise perf pipeline ${cancelled ? 'cancelled' : 'failed'}: ${kind}`,
                labels: ['ttnn-perf-pipeline', kindLabel, 'automated'],
                assignees: ['Aswinmcw'],
                body: `${detail}\n\nRun: ${runUrl}`,
              });
              core.info('Opened new failure issue.');
            }

      # 8. Ping Slack (C09CV1RTNJC) with the failing stage + a human reason so a
      #    failed day is noticed without watching Actions. Plain chat.postMessage
      #    curl (no third-party action to trust/pin); the SLACK_BOT_TOKEN org
      #    secret needs chat:write and the bot must be IN the channel. Payload is
      #    assembled with `jq --arg` (preinstalled on ubuntu-latest) so the reason
      #    / detail / API-error text are JSON-escaped safely — never hand-roll
      #    JSON around error strings in bash, and no heredoc (a python heredoc
      #    breaks under YAML block-scalar dedent). Skips silently if the token is
      #    absent (e.g. a fork) so it never turns a tokenless run red, and a Slack
      #    hiccup only warns — the issue was already filed above.
      - name: Notify Slack on failure or cancel
        if: failure() || cancelled()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: C09CV1RTNJC
          FAIL_KIND: ${{ env.FAIL_KIND }}
          FAIL_DETAIL: ${{ env.FAIL_DETAIL }}
          JOB_STATUS: ${{ job.status }}
          # The resolved run (empty if we failed before resolving it).
          TT_RUN_ID: ${{ steps.resolve.outputs.run_id || github.event.inputs.run_id }}
          RUN_DATE: ${{ steps.guard.outputs.date }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_BOT_TOKEN:-}" ]; then
            echo "SLACK_BOT_TOKEN not set — skipping Slack notification."
            exit 0
          fi
          # A cancel sets no FAIL_KIND (no step ran the mapping) -> derive it from
          # the job status so the message says "cancelled" with a recover hint,
          # rather than the generic unlabelled-failure text.
          KIND="${FAIL_KIND:-}"
          if [ -z "$KIND" ] && [ "${JOB_STATUS:-}" = "cancelled" ]; then KIND="cancelled"; fi
          KIND="${KIND:-pipeline-failure}"
          CANCEL_HINT=""
          # Map the machine FAIL_KIND to a one-line human reason.
          case "$KIND" in
            poll-api-error)     REASON="GitHub API kept failing while polling the tt-metal run (outage / bad token)." ;;
            poll-timeout)       REASON="tt-metal run did not complete within 5.5h." ;;
            tt-run-failed)      REASON="The tt-metal run itself failed (all-or-nothing: no data landed)." ;;
            artifact-missing)   REASON="A combo was missing shard artifacts (expected ${SHARD_TOTAL})." ;;
            combo-provenance-mismatch) REASON="A run measured a different dtype/shape/arch than the combo it would land in — refused to commit mislabeled data." ;;
            merge-failed)       REASON="Shard merge produced no results JSON." ;;
            resolve-run-not-found)       REASON="No tt-metal run to ingest: monitor got a missing/foreign run_id, or recover found no successful run." ;;
            recover-run-not-successful)  REASON="Recover: the supplied tt-metal run is not completed/successful." ;;
            stale-data)         REASON="Freshness check: some combos have no result from the last 24h. Check the box log (~/perf-ci-dispatch.log) and the last monitor run." ;;
            cancelled)          REASON="Run was cancelled (hosted-runner shutdown or manual)."
                                CANCEL_HINT="The dispatched tt-metal run may have finished OK — re-run with *mode=recover* to ingest it." ;;
            pipeline-failure|*) REASON="Pipeline failed at an unlabelled stage." ;;
          esac
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          DATE="${RUN_DATE:-n/a}"
          TT_URL=""
          [ -n "${TT_RUN_ID:-}" ] && TT_URL="https://github.com/${TT_REPO}/actions/runs/${TT_RUN_ID}"
          if [ "$KIND" = "cancelled" ]; then
            HEADER="⚠️ Daily eltwise perf pipeline cancelled"; LEAD=":warning: Daily eltwise perf pipeline cancelled"
          else
            HEADER="🚨 Daily eltwise perf pipeline failed";    LEAD=":rotating_light: Daily eltwise perf pipeline failed"
          fi

          # Assemble the whole mrkdwn body INSIDE jq (not via bash $(...), which
          # strips the trailing newlines and runs the lines together). Optional
          # Detail / cancel-hint / tt-metal-run link are appended only when set.
          PAYLOAD=$(jq -n \
            --arg channel "$SLACK_CHANNEL" \
            --arg reason  "$REASON" \
            --arg kind    "$KIND" \
            --arg detail  "${FAIL_DETAIL:-}" \
            --arg hint    "$CANCEL_HINT" \
            --arg date    "$DATE" \
            --arg runurl  "$RUN_URL" \
            --arg tturl   "$TT_URL" \
            --arg header  "$HEADER" \
            --arg lead    "$LEAD" '
            ( "*Reason:* " + $reason
              + "\n*Stage:* `" + $kind + "`"
              + (if $detail != "" then "\n*Detail:* " + $detail else "" end)
              + (if $hint   != "" then "\n" + $hint else "" end)
              + "\n*Date:* " + $date
              + "\n<" + $runurl + "|pipeline run>"
              + (if $tturl != "" then " · <" + $tturl + "|tt-metal run>" else "" end)
            ) as $body |
            { channel: $channel,
              text: ($lead + " (" + $date + ") — " + $reason),
              blocks: [
                {type:"header", text:{type:"plain_text", text:$header, emoji:true}},
                {type:"section", text:{type:"mrkdwn", text:$body}}
              ] }')

          # Slack returns HTTP 200 even on logical errors; inspect the JSON "ok".
          RESP=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$PAYLOAD")
          if printf '%s' "$RESP" | grep -q '"ok":true'; then
            echo "✅ Slack notified (${KIND})."
          else
            echo "::warning::Slack notify failed: ${RESP}"
          fi
